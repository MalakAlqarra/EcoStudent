<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Portal EcoStudent</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-section">
                <div class="eco-logo">🌿</div>
                <h1>Portal EcoStudent</h1>
                <p>بوابتك الذكية لمستقبل أكاديمي مستدام</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">الرقم الجامعي / اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل رقمك الجامعي" required>
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <div class="input-group">
                    <label for="userRole">نوع المستخدم</label>
                    <select id="userRole">
                        <option value="student">طالب (Student)</option>
                        <option value="admin">مسؤول نظام (Administrator)</option>
                    </select>
                </div>

                <button type="submit" class="login-btn">دخول إلى النظام</button>
            </form>
            
            <div class="footer-links">
                <a href="#">نسيت كلمة المرور؟</a>
                <a href="#">المساعدة والدعم</a>
            </div>
        </div>
    </div>
</body>
</html>
